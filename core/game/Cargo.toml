[package]
name = "chrogue-game"
description = "The roguelite layer of Chrogue (runs, relics, upgrades, offers, floors, battles, saved data) and its JSON command protocol."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "chrogue_game"

[dependencies]
chrogue-engine = { path = "../engine" }
# The protocol and the saved data are JSON. The crate builds the values by hand, thus it needs no derive macros.
serde_json = "1"
