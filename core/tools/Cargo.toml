[package]
name = "chrogue-tools"
description = "Command-line tools for Chrogue: a perft timer, self-play matches, data of the AI, and battles of the game with relics."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "chrogue_tools"

[dependencies]
chrogue-engine = { path = "../engine" }
chrogue-game = { path = "../game" }
serde_json = "1"
