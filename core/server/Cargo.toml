[package]
name = "chrogue-server"
description = "The command server of Chrogue: newline-delimited JSON over stdio or a loopback TCP socket."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "chrogue-core"
path = "src/main.rs"

[dependencies]
chrogue-game = { path = "../game" }
serde_json = "1"
